name: Update Fuel Prices

on:
  schedule:
    # Once a day at 11:07 UTC (~7:07am ET). AAA refreshes its national averages overnight.
    - cron: "7 11 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-fuel-prices:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch national prices from AAA
        run: node scripts/update-prices.js

      - name: Commit updated data.json
        run: |
          git config user.name "fuel-price-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet || git commit -m "Update fuel prices $(date -u +'%Y-%m-%d')"
          git push || (git pull --rebase && git push)
