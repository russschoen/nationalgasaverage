yaml
name: Update Fuel Prices

on:
  schedule:
    - cron: "0 13 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-prices:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch latest EIA fuel prices
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
        run: node scripts/update-prices.js

      - name: Commit updated data.json
        run: |
          git config user.name "fuel-price-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet || git commit -m "Update fuel prices $(date -u +'%Y-%m-%d')"
          git push
