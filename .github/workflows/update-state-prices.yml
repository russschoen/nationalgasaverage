name: Update State Fuel Prices

on:
  schedule:
    # Once a day at 11:17 UTC (~7:17am ET). AAA refreshes its state table overnight.
    - cron: "17 11 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-state-prices:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch state gas prices from AAA
        run: node scripts/update-state-prices.js

      - name: Commit updated states-data.json
        run: |
          git config user.name "fuel-price-bot"
          git config user.email "actions@users.noreply.github.com"
          git add states-data.json
          git diff --cached --quiet || git commit -m "Update state fuel prices $(date -u +'%Y-%m-%d')"
          git push || (git pull --rebase && git push)
