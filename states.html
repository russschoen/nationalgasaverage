<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gas Prices by State | National Gas Average</title>
<style>
  :root {
    --bg: #05070d; --bg-2: #0b0f1a; --card: #10141f; --border: #1f2635;
    --text: #f3f5f9; --text-dim: #8a93a6; --accent: #ffb020;
    --green: #35d07f; --red: #ff5c5c; --blue: #4fb8ff;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg: #eef1f6; --bg-2: #ffffff; --card: #ffffff; --border: #dbe0ea;
      --text: #10141f; --text-dim: #5a6272;
    }
  }
  :root[data-theme="dark"] {
    --bg: #05070d; --bg-2: #0b0f1a; --card: #10141f; --border: #1f2635;
    --text: #f3f5f9; --text-dim: #8a93a6;
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }

  header { padding: 24px 20px 16px; text-align: center; background: radial-gradient(circle at 50% 0%, rgba(255,176,32,0.08), transparent 60%); }
  header .back { display: inline-block; margin-bottom: 10px; font-size: 12px; color: var(--blue); text-decoration: none; }
  header h1 { font-size: clamp(20px, 5vw, 28px); margin: 0 0 6px; font-weight: 700; }
  header .updated { font-size: 12px; color: var(--text-dim); }

  main { max-width: 760px; margin: 0 auto; padding: 20px 16px 50px; }

  .search-wrap { margin-bottom: 18px; }
  .search-row { display: flex; gap: 8px; }
